<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name = "description" content = "What is the meaning of life?">
        <title>Timeline</title>

        <a href="Timeline Data.xlsx"></a>
        <link rel = "stylesheet" href="css/style.css">

        <link rel="icon" href="img/Symbol Icon.ico">
    </head>

    <body>
        <div id="timeline1">
            <!-- Include a header DIV with the same name as the draggable DIV, followed by "header" -->
            <div id="cursor1"></div>
        </div>

        <div id="timeline2">
            <!-- Include a header DIV with the same name as the draggable DIV, followed by "header" -->
            <div id="cursor2"></div>
        </div>

        <div id="timeline3">
            <!-- Include a header DIV with the same name as the draggable DIV, followed by "header" -->
            <div id="cursor3"></div>
        </div>
        
        <audio id="holySound">
            <source src="audio/HolySound.wav" type="audio/wav">
        </audio>

        <audio id="music">
            <source src="audio/BG Music 1 Muffle - Loop.wav" type="audio/wav">
        </audio>

        <input type="text" id="spotlight">

        <input type="number" id="myaWrite">



        <canvas id="myCanvas" width="1760" height="630"></canvas>

        <script src="js/main.js"></script>

        <script src="js/descriptionLookup.js"></script>

        <video id="map" width="400">
            <source src="img/Tectonic Plates Movement Animation.mp4" type="video/mp4">
        </video>

        <textarea id="momentDesc" name="Moment Events" rows="4" cols="50">
            NULL
        </textarea>

        <script>
            spotlightZero();

            document.getElementById("myaWrite").oninput = function() {myFunction()};
            
            function myFunction() {
              var x = document.getElementById("spotlight");
              x.value = 0;
              if (document.getElementById("myaWrite").value<0) {
                document.getElementById("myaWrite").value=0;
              }
              if (document.getElementById("myaWrite").value>4600) {
                document.getElementById("myaWrite").value=4600;
              }

              spotlightZero();


              document.getElementById("myaWrite").value = Math.ceil(document.getElementById("myaWrite").value);
              
            }


            drawTimelineDynamic();

            //document.getElementById("music").play();

            var isOnTimeline = false;
            document.getElementById("timeline1").onmouseover = function(){isOnTimeline=true};
            document.getElementById("timeline2").onmouseover = function(){isOnTimeline=true};
            document.getElementById("timeline3").onmouseover = function(){isOnTimeline=true};
            document.getElementById("timeline1").onmouseleave = function(){isOnTimeline=false};
            document.getElementById("timeline2").onmouseleave = function(){isOnTimeline=false};
            document.getElementById("timeline3").onmouseleave = function(){isOnTimeline=false};

            document.body.addEventListener('click', anyClick);
            function anyClick() {
                var e = window.event;

                var posX = e.clientX;
                var posY = e.clientY;

                if (!isOnTimeline && posX>0 && posX<canvas.width) {
                    isTransfer2=true;
  	                isTransfer3=true;

                    if (posY<=192) {
                        cursorTo(posX,1);
                    }else if (posY<412) {
                        cursorTo(posX,2);
                    }else if (posY<412 + 73*2) {
                        cursorTo(posX,3);
                    }
                }
            }

            document.getElementById("momentDesc").innerHTML = getMomentDescription(mya);
            

        </script>
        
    </body>
</html>
